<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Floor Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #388E3C 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, .03) 2px, rgba(255, 255, 255, .03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 255, 255, .03) 2px, rgba(255, 255, 255, .03) 4px);
            pointer-events: none;
        }

        .header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .factory-name {
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .machine-id {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .timestamp {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        .connection-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1;
        }

        .status-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .status {
            flex: 2;
            min-width: 300px;
            padding: 45px 40px;
            border-radius: 20px;
            font-size: clamp(48px, 6vw, 72px);
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .status::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .ml-prediction-card {
            flex: 1;
            min-width: 250px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .ml-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .ml-value {
            font-size: 40px;
            font-weight: bold;
            color: #1B5E20;
            text-align: center;
            line-height: 1.2;
        }

        .green {
            background: linear-gradient(135deg, #27AE60 0%, #4CAF50 100%);
            animation: pulse-green 2s ease-in-out infinite;
        }

        .yellow {
            background: linear-gradient(135deg, #F39C12 0%, #F1C40F 100%);
            color: #000;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            animation: pulse-yellow 1s ease-in-out infinite;
        }

        .red {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
            animation: pulse-red 0.5s ease-in-out infinite;
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4); }
            50% { box-shadow: 0 15px 60px rgba(243, 156, 18, 0.6); }
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4); }
            50% { box-shadow: 0 15px 60px rgba(231, 76, 60, 0.8); }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #1B5E20, #4CAF50);
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .metric-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .metric-icon {
            font-size: 32px;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.1));
        }

        .metric-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .metric-value {
            font-size: 48px;
            font-weight: bold;
            color: #1B5E20;
            font-family: 'Courier New', monospace;
            margin-left: 44px;
        }

        .metric-unit {
            font-size: 24px;
            color: #888;
            margin-left: 5px;
        }

        .audio-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .audio-indicator:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        .audio-indicator.show {
            display: flex;
        }

        .audio-indicator.playing {
            background: rgba(231, 76, 60, 0.9);
            animation: pulse-audio 1s infinite;
        }

        @keyframes pulse-audio {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header-left, .header-right {
                width: 100%;
                justify-content: center;
            }

            .factory-name {
                font-size: 20px;
            }

            .status {
                padding: 30px 20px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .status-section {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="factory-name">🏭 PRODUCTION LINE A</div>
            <div class="machine-id">MACHINE #47</div>
        </div>
        <div class="header-right">
            <div class="connection-status" id="connectionStatus"></div>
            <div class="timestamp" id="timestamp">--:--:--</div>
        </div>
    </div>

    <div class="container">
        <div class="status-section">
            <div id="status" class="status green">
                <span class="status-icon">⚙️</span>
                LOADING...
            </div>
            <div class="ml-prediction-card">
                <div class="ml-label">🤖 ML Prediction</div>
                <div class="ml-value" id="ml">Analyzing...</div>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon">🌡️</div>
                    <div class="metric-label">Temperature</div>
                </div>
                <div class="metric-value" id="temp">-<span class="metric-unit">°C</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon">📳</div>
                    <div class="metric-label">Vibration</div>
                </div>
                <div class="metric-value" id="vibration">-<span class="metric-unit">g</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-header">
                    <div class="metric-icon">⚡</div>
                    <div class="metric-label">RPM</div>
                </div>
                <div class="metric-value" id="rpm">-<span class="metric-unit"></span></div>
            </div>
        </div>
    </div>

    <div class="audio-indicator" id="audioIndicator">
        🔊 Click to enable sound alerts
    </div>

    <audio id="criticalSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <audio id="warningSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2871/2871-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const statusEl = document.getElementById('status');
        const tempEl = document.getElementById('temp');
        const vibrationEl = document.getElementById('vibration');
        const rpmEl = document.getElementById('rpm');
        const mlEl = document.getElementById('ml');
        const timestampEl = document.getElementById('timestamp');
        const connectionStatusEl = document.getElementById('connectionStatus');
        const audioIndicator = document.getElementById('audioIndicator');
        const criticalSound = document.getElementById('criticalSound');
        const warningSound = document.getElementById('warningSound');
        let previousStatus = null;
        let audioEnabled = false;

        const statusIcons = {
            NORMAL: '✓',
            WARNING: '⚠️',
            CRITICAL: '🚨',
            ERROR: '❌'
        };

        function enableAudio() {
            if (!audioEnabled) {
                criticalSound.load();
                warningSound.load();
                audioEnabled = true;
                audioIndicator.classList.remove('show');
                console.log('Audio enabled');
            }
        }

        document.addEventListener('click', enableAudio, { once: true });
        audioIndicator.addEventListener('click', () => {
            enableAudio();
            audioIndicator.classList.remove('show');
        });

        function stopAllSounds() {
            criticalSound.pause();
            criticalSound.currentTime = 0;
            warningSound.pause();
            warningSound.currentTime = 0;
            audioIndicator.classList.remove('playing');
        }

        function playCriticalSound() {
            stopAllSounds();
            if (audioEnabled) {
                criticalSound.volume = 0.8;
                criticalSound.play().catch(e => {
                    console.error("Critical audio play error:", e);
                    audioIndicator.classList.add('show');
                });
                audioIndicator.classList.add('playing');
                audioIndicator.innerHTML = '🚨 CRITICAL ALERT ACTIVE';
            } else {
                audioIndicator.classList.add('show');
            }
        }

        function playWarningSound() {
            stopAllSounds();
            if (audioEnabled) {
                warningSound.volume = 0.6;
                warningSound.play().catch(e => {
                    console.error("Warning audio play error:", e);
                    audioIndicator.classList.add('show');
                });
                audioIndicator.classList.add('playing');
                audioIndicator.innerHTML = '⚠️ WARNING ALERT ACTIVE';
            } else {
                audioIndicator.classList.add('show');
            }
        }

        function updateTimestamp() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timestampEl.textContent = `${hours}:${minutes}:${seconds}`;
        }

        async function fetchData() {
            try {
                console.log('Fetching data from backend...');
                const res = await fetch("http://192.168.3.98:5000/alerts");
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                
                const data = await res.json();
                console.log('Data received:', data);

                connectionStatusEl.style.background = '#4CAF50';
                connectionStatusEl.style.boxShadow = '0 0 10px #4CAF50';

                let colorClass = 'green';
                let icon = statusIcons.NORMAL;

                if (data.overall_status === "CRITICAL") {
                    colorClass = 'red';
                    icon = statusIcons.CRITICAL;
                    if (previousStatus !== "CRITICAL") {
                        playCriticalSound();
                    }
                } else if (data.overall_status === "WARNING") {
                    colorClass = 'yellow';
                    icon = statusIcons.WARNING;
                    if (previousStatus !== "WARNING") {
                        playWarningSound();
                    }
                } else {
                    stopAllSounds();
                    audioIndicator.innerHTML = '🔊 Click to enable sound alerts';
                }

                previousStatus = data.overall_status;

                statusEl.className = `status ${colorClass}`;
                statusEl.innerHTML = `<span class="status-icon">${icon}</span>${data.overall_status}`;

                tempEl.innerHTML = `${data.temp ?? '-'}<span class="metric-unit">°C</span>`;
                vibrationEl.innerHTML = `${data.vibration ?? '-'}<span class="metric-unit">g</span>`;
                rpmEl.innerHTML = `${data.rpm ?? '-'}<span class="metric-unit"></span>`;
                
                // Use alert_prediction field (consistent with Alert.js)
                mlEl.textContent = data.alert_prediction ?? 'No prediction';

            } catch (err) {
                console.error('Fetch error:', err);
                connectionStatusEl.style.background = '#E74C3C';
                connectionStatusEl.style.boxShadow = '0 0 10px #E74C3C';

                statusEl.innerHTML = `<span class="status-icon">${statusIcons.ERROR}</span>CONNECTION ERROR`;
                statusEl.className = 'status red';
                tempEl.innerHTML = '-<span class="metric-unit">°C</span>';
                vibrationEl.innerHTML = '-<span class="metric-unit">g</span>';
                rpmEl.innerHTML = '-<span class="metric-unit"></span>';
                mlEl.textContent = 'Offline';
                stopAllSounds();
            }
        }

        updateTimestamp();
        setInterval(updateTimestamp, 1000);

        fetchData();
        setInterval(fetchData, 2000);
        
        console.log('Factory display initialized. Backend URL: http://192.168.3.98:5000/alerts');
    </script>
</body>
</html>
