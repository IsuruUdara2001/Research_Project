<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Floor Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: linear-gradient(180deg, #1a1f3a 0%, #0f1428 100%);
            border-bottom: 3px solid #00ff41;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.3);
        }

        .facility-info {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .facility-name {
            font-size: 28px;
            font-weight: 700;
            color: #00ff41;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .machine-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff41;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            color: #00ff41;
            letter-spacing: 1px;
        }

        .system-info {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: 700;
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            letter-spacing: 2px;
        }

        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 4px;
            border: 1px solid #00ff41;
        }

        .connection-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ff41;
            box-shadow: 0 0 15px #00ff41;
            animation: pulse 2s infinite;
        }

        .connection-dot.error {
            background: #ff0040;
            box-shadow: 0 0 15px #ff0040;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .connection-text {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            padding: 25px 40px;
            overflow: hidden;
        }

        .status-panel {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1428 100%);
            border: 3px solid;
            border-radius: 8px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .status-panel.normal {
            border-color: #00ff41;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .status-panel.warning {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), inset 0 0 50px rgba(0, 0, 0, 0.5);
            animation: warning-pulse 2s infinite;
        }

        .status-panel.critical {
            border-color: #ff0040;
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.5), inset 0 0 50px rgba(0, 0, 0, 0.5);
            animation: critical-pulse 1s infinite;
        }

        @keyframes warning-pulse {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), inset 0 0 50px rgba(0, 0, 0, 0.5);
            }

            50% {
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.7), inset 0 0 50px rgba(0, 0, 0, 0.5);
            }
        }

        @keyframes critical-pulse {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(255, 0, 64, 0.5), inset 0 0 50px rgba(0, 0, 0, 0.5);
            }

            50% {
                box-shadow: 0 0 70px rgba(255, 0, 64, 0.9), inset 0 0 50px rgba(0, 0, 0, 0.5);
            }
        }

        .status-label {
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .status-value {
            font-size: 120px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            line-height: 1;
            margin-bottom: 30px;
            text-shadow: 0 0 30px currentColor;
        }

        .status-icon {
            font-size: 100px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px currentColor);
        }

        .normal .status-value,
        .normal .status-icon {
            color: #00ff41;
        }

        .warning .status-value,
        .warning .status-icon {
            color: #ffd700;
        }

        .critical .status-value,
        .critical .status-icon {
            color: #ff0040;
        }

        .ml-prediction {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1428 100%);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .ml-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .ml-icon {
            font-size: 36px;
        }

        .ml-title {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00d4ff;
        }

        .ml-result {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 6px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .metrics-section {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .metric-box {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1428 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .metric-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
        }

        .metric-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-icon {
            font-size: 42px;
            filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.5));
        }

        .metric-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
        }

        .metric-reading {
            font-family: 'Courier New', monospace;
            font-size: 64px;
            font-weight: 700;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            letter-spacing: 2px;
            margin-left: 57px;
        }

        .metric-unit {
            font-size: 32px;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 10px;
        }

        .alert-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 64, 0.95);
            border: 4px solid #ff0040;
            padding: 40px 60px;
            border-radius: 12px;
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 100px rgba(255, 0, 64, 0.8);
            z-index: 1000;
            display: none;
            animation: alert-flash 0.5s infinite;
        }

        .alert-indicator.active {
            display: block;
        }

        @keyframes alert-flash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .audio-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .audio-control:hover {
            background: rgba(0, 255, 65, 0.2);
            transform: scale(1.05);
        }

        .audio-control.active {
            border-color: #ff0040;
            background: rgba(255, 0, 64, 0.2);
        }

        @media (max-width: 1400px) {
            .status-value {
                font-size: 90px;
            }

            .status-icon {
                font-size: 80px;
            }

            .metric-reading {
                font-size: 52px;
            }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .metrics-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                gap: 15px;
            }

            .metrics-section {
                grid-template-columns: 1fr;
            }

            .status-value {
                font-size: 64px;
            }
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <div class="facility-info">
            <div class="facility-name">🏭 PRODUCTION LINE A</div>
            <div class="machine-badge">MACHINE #47</div>
        </div>
        <div class="system-info">
            <div class="connection-indicator">
                <div class="connection-dot" id="connectionDot"></div>
                <div class="connection-text" id="connectionText">ONLINE</div>
            </div>
            <div class="time-display" id="timeDisplay">00:00:00</div>
        </div>
    </div>

    <div class="main-content">
        <div class="status-panel normal" id="statusPanel">
            <div class="status-label">SYSTEM STATUS</div>
            <div class="status-icon" id="statusIcon">✓</div>
            <div class="status-value" id="statusValue">LOADING</div>
        </div>

        <div class="ml-prediction">
            <div class="ml-header">
                <div class="ml-icon">🤖</div>
                <div class="ml-title">AI PREDICTION</div>
            </div>
            <div class="ml-result" id="mlResult">Analyzing...</div>
        </div>

        <div class="metrics-section">
            <div class="metric-box">
                <div class="metric-header">
                    <div class="metric-icon">🌡️</div>
                    <div class="metric-title">Temperature</div>
                </div>
                <div class="metric-reading" id="tempReading">---<span class="metric-unit">°C</span></div>
            </div>

            <div class="metric-box">
                <div class="metric-header">
                    <div class="metric-icon">📳</div>
                    <div class="metric-title">Vibration</div>
                </div>
                <div class="metric-reading" id="vibrationReading">---<span class="metric-unit">g</span></div>
            </div>

            <div class="metric-box">
                <div class="metric-header">
                    <div class="metric-icon">⚡</div>
                    <div class="metric-title">RPM</div>
                </div>
                <div class="metric-reading" id="rpmReading">---<span class="metric-unit"></span></div>
            </div>
        </div>
    </div>

    <div class="alert-indicator" id="alertIndicator">
        🚨 CRITICAL ALERT 🚨
    </div>

    <div class="audio-control" id="audioControl">
        🔊 <span>ENABLE AUDIO</span>
    </div>

    <audio id="criticalSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <audio id="warningSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2871/2871-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const statusPanel = document.getElementById('statusPanel');
        const statusIcon = document.getElementById('statusIcon');
        const statusValue = document.getElementById('statusValue');
        const mlResult = document.getElementById('mlResult');
        const tempReading = document.getElementById('tempReading');
        const vibrationReading = document.getElementById('vibrationReading');
        const rpmReading = document.getElementById('rpmReading');
        const timeDisplay = document.getElementById('timeDisplay');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');
        const alertIndicator = document.getElementById('alertIndicator');
        const audioControl = document.getElementById('audioControl');
        const criticalSound = document.getElementById('criticalSound');
        const warningSound = document.getElementById('warningSound');

        let audioEnabled = false;
        let previousStatus = null;

        const statusConfig = {
            NORMAL: { icon: '✓', class: 'normal' },
            WARNING: { icon: '⚠️', class: 'warning' },
            CRITICAL: { icon: '🚨', class: 'critical' },
            ERROR: { icon: '❌', class: 'critical' }
        };

        audioControl.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            if (audioEnabled) {
                criticalSound.load();
                warningSound.load();
                audioControl.classList.add('active');
                audioControl.innerHTML = '🔇 <span>AUDIO ON</span>';
            } else {
                stopAllSounds();
                audioControl.classList.remove('active');
                audioControl.innerHTML = '🔊 <span>ENABLE AUDIO</span>';
            }
        });

        function stopAllSounds() {
            criticalSound.pause();
            criticalSound.currentTime = 0;
            warningSound.pause();
            warningSound.currentTime = 0;
            alertIndicator.classList.remove('active');
        }

        function playCriticalSound() {
            stopAllSounds();
            if (audioEnabled) {
                criticalSound.volume = 0.7;
                criticalSound.play().catch(e => console.error("Audio error:", e));
                alertIndicator.classList.add('active');
            }
        }

        function playWarningSound() {
            stopAllSounds();
            if (audioEnabled) {
                warningSound.volume = 0.5;
                warningSound.play().catch(e => console.error("Audio error:", e));
            }
        }

        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${h}:${m}:${s}`;
        }

        async function fetchData() {
            try {
                const res = await fetch("http://192.168.3.98:5000/alerts");

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();

                connectionDot.classList.remove('error');
                connectionText.textContent = 'ONLINE';

                const status = data.overall_status || 'NORMAL';
                const config = statusConfig[status] || statusConfig.NORMAL;

                statusPanel.className = `status-panel ${config.class}`;
                statusIcon.textContent = config.icon;
                statusValue.textContent = status;

                if (status === "CRITICAL" && previousStatus !== "CRITICAL") {
                    playCriticalSound();
                } else if (status === "WARNING" && previousStatus !== "WARNING") {
                    playWarningSound();
                } else if (status === "NORMAL") {
                    stopAllSounds();
                }

                previousStatus = status;

                tempReading.innerHTML = `${data.temp ?? '---'}<span class="metric-unit">°C</span>`;
                vibrationReading.innerHTML = `${data.vibration ?? '---'}<span class="metric-unit">g</span>`;
                rpmReading.innerHTML = `${data.rpm ?? '---'}<span class="metric-unit"></span>`;
                mlResult.textContent = data.alert_prediction ?? 'No prediction';

            } catch (err) {
                console.error('Connection error:', err);

                connectionDot.classList.add('error');
                connectionText.textContent = 'OFFLINE';

                statusPanel.className = 'status-panel critical';
                statusIcon.textContent = '❌';
                statusValue.textContent = 'ERROR';

                tempReading.innerHTML = '---<span class="metric-unit">°C</span>';
                vibrationReading.innerHTML = '---<span class="metric-unit">g</span>';
                rpmReading.innerHTML = '---<span class="metric-unit"></span>';
                mlResult.textContent = 'Connection Lost';

                stopAllSounds();
            }
        }

        updateTime();
        setInterval(updateTime, 1000);

        fetchData();
        setInterval(fetchData, 2000);
    </script>
</body>

</html>
